{% extends "base.html" %}
{% block content %}
  <div class="container">
      <div class="row justify-content-center">
          <div class="col-md-10" style="margin-top:80px;">
            <form class="d-flex text-end" action="{{ url_for('main.search') }}" method="get"  style="margin-bottom: 50px;">
                  <div class="search-suggest-wrap" style="width: 60%; margin-left: 20%;">
                      <div class="input-group">
                          <input type="hidden" name="lang" id="lang" value="{{ g.get('lang', 'en') }}">
                          <input name="q" class="form-control form-control-lg shadow-none si" type="search" value="{{ query }}" aria-label="{{ _('Search') }}" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="search-suggest-list" autocapitalize="off">
                          <button class="btn btn-primary btn-clarus px-4 shadow-none" type="submit">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#fff" class="bi bi-search" viewBox="0 0 16 16">
<path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
</svg>
                          </button>
                      </div>
                      <ul class="search-suggest-list" id="search-suggest-list" role="listbox" aria-label="{{ _('Suggestions') }}" hidden></ul>
                  </div>
              </form>
            <h2 class="serif-font" style="margin-bottom: 20px;">{{ _('Results for') }} "{{ query }}"</h2>
            {% if results %}
                {% for row in results %}
                    <div class="search-result">
                        <h5 class="serif-font">{{ row['word'] }}</h5>
                        <p>{{ row['definition'] }}</p>
                        <a href="{{ url_for('main.term_entry', term_id=row['id']) }}"><span class="link-spanner"></span></a>
                    </div>
                {% endfor %}
            {% else %}
            <p>
                &nbsp; {{ _('No matches found.') }}
            </p>
            {% endif %}   
            <p> &nbsp; </p>   
          </div>
      </div>
  </div>
{% endblock %}
