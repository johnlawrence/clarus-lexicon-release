{% extends "base.html" %}

{% block content %}
  <div class="container">
      <div class="row justify-content-center">
          <div class="col-md-6 text-center" style="margin-top:12%;">
              <div class="home-hero">
                  <img src="{{ url_for('static', filename= 'img/clarus-logo.png') }}" class="home-hero-logo" alt="{{ _('Clarus logo') }}" />
                  <h1 class="home-hero-title">{{ _('Multilingual Lexicon of Digital Forensics') }}</h1>
              </div>
              <form class="d-flex" action="{{ url_for('main.search') }}" method="get">
                  <div class="search-suggest-wrap">
                      <div class="input-group">
                          <input type="hidden" name="lang" id="lang" value="{{ g.get('lang', 'en') }}">
                          <input name="q" class="form-control form-control-lg shadow-none si" type="search" placeholder="{{ _('Search...') }}" aria-label="{{ _('Search') }}" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="search-suggest-list" autocapitalize="off" autofocus>
                          <button class="btn btn-primary btn-clarus px-4 shadow-none" type="submit">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#fff" class="bi bi-search" viewBox="0 0 16 16">
<path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
</svg>
                          </button>
                      </div>
                      <ul class="search-suggest-list" id="search-suggest-list" role="listbox" aria-label="{{ _('Suggestions') }}" hidden></ul>
                  </div>
              </form>
          </div>
      </div>
  </div>
{% endblock %}
